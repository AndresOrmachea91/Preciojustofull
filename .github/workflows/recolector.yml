# Recolector diario sobre GitHub Actions: no hace falta servidor propio.
# El historial de ejecuciones queda visible en GitHub y sirve como evidencia
# para la métrica de disponibilidad efectiva del dato.
name: Recolector diario

on:
  schedule:
    # 07:00, 15:00 y 23:00 UTC = 03:00, 11:00 y 19:00 en Bolivia.
    # Tres ventanas y no una sola: si el único intento falla, se pierde el día.
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Recolectar precios mayoristas
        run: |
          for producto in 5 12 30; do
            python -m src.adaptadores.entrada.cli.recolectar \
              --fuente diario --producto "$producto" || echo "Falló $producto"
          done
