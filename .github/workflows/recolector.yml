# Recolector sobre GitHub Actions contra Neon. RETIRADO del calendario el
# 13 de octubre de 2026 (C118): la recolección diaria la hace el contenedor
# "recolector" (docker-compose.yml) sobre la base propia, y Neon queda solo
# para leer. Dos recolectores en dos bases darían dos series distintas.
# Queda la ejecución manual (workflow_dispatch) por si hiciera falta
# completar Neon alguna vez; necesita el secreto BASE_DATOS_URL.
name: Recolector (manual, contra Neon)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:
      BASE_DATOS_URL: ${{ secrets.BASE_DATOS_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verificar que la base esté configurada
        run: |
          if [ -z "$BASE_DATOS_URL" ]; then
            echo "::error::Falta el secreto BASE_DATOS_URL. Sin base, la corrida no guarda nada."
            exit 1
          fi

      # Todo el catálogo de productos, las dos fuentes (mayorista y consumidor
      # final). Sale con 3 si los portales respondieron pero no trajeron NI UN
      # hecho nuevo: eso pinta la corrida en rojo a propósito. Veintidós días
      # de "éxitos" sin un dato nuevo pasaron desapercibidos porque solo se
      # miraba el HTTP.
      - name: Recolectar las dos fuentes sobre todo el catálogo
        timeout-minutes: 30
        run: python -m src.infraestructura.adaptadores.entrada.cli.recolectar

      - name: Resumen de disponibilidad
        if: always()
        run: python -m src.infraestructura.adaptadores.entrada.cli.recolectar --disponibilidad
